[advisories]
# chacha20 was yanked from crates.io after the 0.2.6 freeze; cargo-deny 0.19
# has no per-crate yanked ignore, and updating the frozen tree needs a full
# re-vendor. Keep the gate visible as a warning instead of failing CI.
yanked = "warn"
# Personal fork frozen at the 0.2.6 dependency tree: every advisory below was
# published after upstream's last run of this check (2026-08-23). FastCtx is a
# local stdio tool whose TLS stack only serves update checks, so these are
# recorded here instead of forcing a dependency bump. Drop entries when the
# dependency is actually updated.
ignore = [
    "RUSTSEC-2026-0285",
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0348",
    "RUSTSEC-2026-0349",
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0381",
    "RUSTSEC-2026-0382",
    "RUSTSEC-2026-0386",
    "RUSTSEC-2026-0429",
    "RUSTSEC-2026-0457",
    "RUSTSEC-2026-0462",
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
